<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
 <meta name="description" content="A quiet personal workspace.">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'self' blob:; connect-src 'self'; img-src 'self' blob: data:; media-src blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
 <title>Lumen</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="gate.css">
</head>
<body>
 <main id="entry" class="entry">
  <a class="brand" href="./" aria-label="Lumen 首页"><span class="brand-mark" aria-hidden="true">l</span><span>Lumen</span></a>
  <div class="entry-grid">
   <div class="door-art" aria-hidden="true"><div class="orb"></div><div class="paper paper-back"></div><div class="paper paper-front"><span></span><span></span><span></span><i></i></div><div class="art-caption">A little room of your own.</div></div>
   <section class="entry-card" aria-labelledby="entry-title">
    <div class="quiet-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg></div>
    <h1 id="entry-title">回到自己的空间。</h1>
    <p class="entry-description">输入访问密码，继续。</p>
    <form id="unlock-form" novalidate>
     <label for="access">访问密码</label>
     <div class="password-box"><input id="access" type="password" autocomplete="current-password" required aria-describedby="gate-error" spellcheck="false"><button id="show-password" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
     <p id="gate-error" class="gate-error" role="alert"></p>
     <button id="unlock" class="unlock" type="submit"><span>打开空间</span><span id="busy" class="busy" hidden aria-hidden="true"></span></button>
     <p id="gate-status" class="gate-status" role="status">内容将在本机解锁。</p>
    </form>
    <noscript>请启用 JavaScript 后打开此页面。</noscript>
   </section>
  </div>
  <footer class="entry-foot"><span>留一点安静，给自己。</span><span>Lumen</span></footer>
 </main>
 <div id="workspace" hidden></div>
 <script type="module" src="gate.mjs"></script>
</body>
</html>
